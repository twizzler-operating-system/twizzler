[package]
name = "pager-srv"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]
twizzler-abi = { path = "../../lib/twizzler-abi" }
twizzler-rt-abi = { path = "../../abi/rt-abi" }
twizzler-queue = { workspace = true }
twizzler-driver = { workspace = true }
twizzler-runtime = { workspace = true }
secgate = { workspace = true }
object-store = { workspace = true }
twizzler = { workspace = true }
nvme = { workspace = true }
devmgr = { workspace = true }
slab = { workspace = true, features = [] }
itertools = { workspace = true }
stable-vec = { workspace = true }
rand = "*"
pager = { path = "../../lib/pager" }
heapless = { workspace = true }
async-channel = { workspace = true }
smallvec = { workspace = true }
libc = "*"

volatile = { workspace = true }
bitvec = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
miette = { workspace = true }
tracing-log = { workspace = true }

twizzler-futures = { workspace = true }
colored = { workspace = true }
