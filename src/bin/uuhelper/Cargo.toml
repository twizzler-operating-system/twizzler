
[package]
name = "uuhelper"
version = "0.1.0"
edition = "2021"

[features]
default = ["feat_os_twizzler"]

feat_os_twizzler = [
    "b2sum",
    "base32",
    "base64",
    "basename",
    "basenc",
    "cat",
    "cksum",
    "comm",
    "cp",
    "csplit",
    "cut",
    "date",
    "dir",
    "dircolors",
    "dirname",
    "echo",
    "expand",
    "expr",
    "factor",
    "false",
    "fmt",
    "fold",
    "join",
    "ln",
    "ls",
    "md5sum",
    "mkdir",
    "nl",
    "numfmt",
    "od",
    "paste",
    "pathchk",
    "pr",
    "printenv",
    "printf",
    "ptx",
    "seq",
    "sha1sum",
    "sha224sum",
    "sha256sum",
    "sha384sum",
    "sha512sum",
    "shuf",
    "sleep",
    "sort",
    "sum",
    "tr",
    "true",
    "tsort",
    "unexpand",
    "uniq",
    "vdir",
    "wc",
    "yes",
]

