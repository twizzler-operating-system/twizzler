
[package]
name = "uuhelper"
version = "0.1.0"
edition = "2021"

[features]
default = ["feat_os_twizzler"]

# Also the symlink set: `xtask disk` reads this list to make uuhelper's aliases, so a name here
# has to work, not merely compile -- a name that resolves to a binary which then cannot do its job
# is a worse failure than the name not existing.
#
# Held out although they compile, because the system cannot back them:
#   df                      statfs/fstatfs are ENOSYS
#   chown, chgrp            fchownat is ENOSYS
#   chmod                   sys_chmod accepts without effect; no mode is stored to change
#   mkfifo, mknod           mkfifoat/mknodat are ENOSYS
#   nice                    setpriority is ENOSYS
#   nohup                   needs SIGHUP semantics this system does not have
#
# Held out because they do not build for this target:
#   hostid                  no libc::gethostid
#   hostname                the `hostname` crate has no twizzler support
#   groups, id, install,    uucore/process compiles in POSIX interval timers (timer_create and
#   kill, timeout, whoami   friends) that the libc port does not define
#   who, users, uptime,     uucore/utmpx pulls dns-lookup -> socket2, unported
#   pinky
feat_os_twizzler = [
    "arch",
    "b2sum",
    "base32",
    "base64",
    "basename",
    "basenc",
    "cat",
    "cksum",
    "comm",
    "cp",
    "csplit",
    "cut",
    "date",
    "dd",
    "dir",
    "dircolors",
    "dirname",
    "du",
    "echo",
    "env",
    "expand",
    "expr",
    "factor",
    "false",
    "fmt",
    "fold",
    "head",
    "join",
    "link",
    "ln",
    "logname",
    "ls",
    "md5sum",
    "mkdir",
    "mktemp",
    "more",
    "mv",
    "nl",
    "nproc",
    "numfmt",
    "od",
    "paste",
    "pathchk",
    "pr",
    "printenv",
    "printf",
    "ptx",
    "pwd",
    "readlink",
    "realpath",
    "rm",
    "rmdir",
    "seq",
    "sha1sum",
    "sha224sum",
    "sha256sum",
    "sha384sum",
    "sha512sum",
    "shred",
    "shuf",
    "sleep",
    "sort",
    "split",
    "stat",
    "stty",
    "sum",
    "sync",
    "tac",
    "tail",
    "tee",
    "touch",
    "tr",
    "true",
    "truncate",
    "tsort",
    "tty",
    "uname",
    "unexpand",
    "uniq",
    "unlink",
    "vdir",
    "wc",
    "yes",
]

