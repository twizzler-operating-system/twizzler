[package]
name = "llm-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# The Twizzler backend only exists on Twizzler; the host build keeps the loop
# testable with the in-memory stub.
[target.'cfg(target_os = "twizzler")'.dependencies]
naming = { workspace = true }
twizzler = { workspace = true }
twizzler-rt-abi = { path = "../../abi/rt-abi" }
twizzler-runtime = { workspace = true }

# LiveSource talks to a local Ollama server; only meaningful where we have a
# real socket, i.e. off the Twizzler target.
[target.'cfg(not(target_os = "twizzler"))'.dependencies]
reqwest = { workspace = true, features = ["blocking", "json"] }
