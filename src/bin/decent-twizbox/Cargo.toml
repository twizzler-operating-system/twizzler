[package]
name = "twizbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
