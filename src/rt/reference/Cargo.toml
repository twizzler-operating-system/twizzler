[package]
name = "twz-rt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tick_counter = { workspace = true }
twizzler-rt-abi = { version = "0.99", features = [
    "stderr",
], default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
tracing-subscriber = { workspace = true }
twizzler-abi = { path = "../../lib/twizzler-abi", default-features = false }
dynlink = { workspace = true }
bitflags = "2.4"
smoltcp = { version = "0.13.1", default-features = false, features = [
    # smoltcp's defaults minus phy-raw_socket and phy-tuntap_interface: those are gated on unix
    # inside smoltcp and compile its BSD `phy/sys/bpf.rs` backend (BIOCSETIF/BIOCGBLEN/BPF_HDRLEN),
    # which is meaningless here -- the runtime drives its own device. Twizzler only started
    # matching them when the target claimed the unix family.
    "std", "log", "medium-ethernet", "medium-ip", "medium-ieee802154",
    "proto-ipv4", "proto-dhcpv4", "proto-ipv6", "proto-ipv6-slaac", "proto-dns",
    "proto-ipv4-fragmentation", "proto-sixlowpan-fragmentation",
    "socket-raw", "socket-icmp", "socket-udp", "socket-tcp", "socket-dhcpv4",
    "socket-dns", "socket-mdns", "packetmeta-id", "async", "multicast",
    "auto-icmp-echo-reply",
] }
talc = { workspace = true }
lazy_static = { workspace = true }
atomic = { workspace = true }
elf = { workspace = true }
static_assertions = { workspace = true }
monitor-api = { workspace = true }
secgate = { workspace = true }
stable-vec = { workspace = true }
lru = { workspace = true }
paste = "1"
printf-compat = { workspace = true }
naming-core = { workspace = true }
pager-dynamic = { workspace = true }
ferroc = { workspace = true, features = ["global", "libc"] }
twizzler-io = { path = "../../lib/twizzler-io" }
twizzler-net = { path = "../../lib/twizzler-net" }
libc = { workspace = true }
