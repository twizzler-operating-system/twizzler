getrandom02 = { git = "https://github.com/twizzler-operating-system/getrandom-twizzler.git", branch = "twizzler-0.2", package = "getrandom" }
# 0.4 arrives via rand 0.10 <- uu_shuf/uu_sort. Upstream 0.4 ends its backend chain in
# compile_error! for unknown targets; this is 0.4.3 plus a twizzler arm over
# twz_rt_get_random, the same shape as the 0.2/0.3 forks. Vendored rather than a
# submodule only because the fork repo has no 0.4 branch yet.
getrandom04 = { path = "src/ports/getrandom", package = "getrandom" }

#polling = { git = "https://github.com/twizzler-operating-system/polling.git", branch = "twizzler" }
