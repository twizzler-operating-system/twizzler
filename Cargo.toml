#async-executor = { git = "https://github.com/twizzler-operating-system/async-executor.git", branch = "twizzler" }
async-executor = { path = "src/ports/async-executor" }
# The submodule existed but was never patched in, so the registry copy was used. Its `unix`
# module is `std::os::unix::net` (unix-domain sockets), which twizzler does not have.
async-net = { path = "src/ports/async-net" }
# parking_lot/lock_api forks dropped: the fork's twizzler ThreadParker became unreachable when
# this target gained `target_family = "unix"`. Its cfg_if tries `else if #[cfg(unix)]` *before*
# `target_os = "twizzler"`, so the 108-line twizzler.rs has been dead code and the registry
# crate's pthread-based unix parker is what the monitor has actually been running. Pinning to
# the fork also held parking_lot at 0.12.4, which blocked `cached` 2.x (brush).
#parking_lot = { git = "https://github.com/twizzler-operating-system/parking_lot.git", branch = "twizzler" }
#lock_api = { git = "https://github.com/twizzler-operating-system/parking_lot.git", branch = "twizzler" }
#blocking = { path = "src/ports/blocking" }

#num_cpus = { git = "https://github.com/twizzler-operating-system/num_cpus.git", branch = "twizzler" }


#candle-core = { git = "https://github.com/dbittman/candle.git", branch = "dbittman" }
