# brush-builtins depends on the registry `uucore`, which requires a libc newer than
# src/ports/libc provides -- that alone silently disables the libc [patch] for the whole
# graph (cargo resolves versions target-agnostically, so even an unused arm constrains).
# Point it at the same ported uucore that uuhelper already uses by path.
uucore = { path = "src/ports/coreutils/src/uucore" }
# rustix 1.x for the twizzler target: the registry crate's libc backend is per-OS and has no
