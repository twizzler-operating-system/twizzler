[workspace.metadata]
# Standalone (plain main(), not #[test]) programs that `unittest` runs and grades by exit code
# during `cargo test-all`. Entries carry args since some candidates are subcommand-driven.
#
# logboi-test is deliberately left out: it hits an intermittent #GP fault inside the compartment
#
# lltest covers runtime library loading (dlopen): symbol lookup, .init_array ctors, and TLS in a
# dlopen'd module (tdata/tbss init, threads that predate the load catching up, per-thread
# isolation). Re-enabled 2026-08-30; it used to hang SMP boots by jumping into an unmapped slot
# right after its dlopen (MemoryContextViolation InstructionFetch, re-faulting upcall loop) --
# if the suite wedges here again, that fault is back.
test-programs = [
    { crate = "lltest" },
    { crate = "spawn-test" },
    { crate = "signal-test" },
]
# Plain files copied onto the data disk, as `{ from = <repo-relative>, to = <path in the image> }`.
# The initrd holds only built artifacts and is read whole at boot; the disk is demand-paged, so
# these cost nothing until something opens them. `to` is the image path -- init symlinks `/pkg` to
# `/ext/sysroot/pkg`, so the entry below is `/pkg/twizzler/scripts/ctlsweep.sh` in the guest.
disk-files = [
    { from = "src/bin/ctl/scripts/ctlsweep.sh", to = "/sysroot/pkg/twizzler/scripts/ctlsweep.sh" },
    { from = "src/bin/ctl/scripts/synctest.sh", to = "/sysroot/pkg/twizzler/scripts/synctest.sh" },
    { from = "src/bin/ctl/scripts/shuttest.sh", to = "/sysroot/pkg/twizzler/scripts/shuttest.sh" },
]
